[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cisco-switch-assessment"
version = "0.1.0"
description = "Read-only Cisco switch assessment framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "paramiko>=3.4,<4",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[project.scripts]
cisco-assessment = "cisco_assessment.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cisco_assessment"]
