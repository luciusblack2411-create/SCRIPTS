[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cisco-switch-assessment"
version = "0.1.0"
description = "Read-only Cisco switch assessment framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "paramiko>=3.4,<4",
  "typer>=0.12,<1",
  "genie==26.6",
  "pyats==26.6",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[project.scripts]
cisco-assessment = "cisco_assessment.cli:app"
cisco-pr-review = "cisco_assessment.devtools.pr_review.cli:app"
cisco-implementation = "cisco_assessment.devtools.implementation.cli:app"
cisco-draft-pr-control = "cisco_assessment.devtools.implementation.draft_pr_control_plane_cli:app"
cisco-ready-for-review-control = "cisco_assessment.devtools.ready_for_review_control_plane_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cisco_assessment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cisco_assessment"]
