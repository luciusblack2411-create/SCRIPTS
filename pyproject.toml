[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cisco-switch-assessment"
version = "0.1.0"
description = "Read-only Cisco switch assessment framework"
requires-python = ">=3.11"
dependencies = ["paramiko>=3.5,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/cisco_switch_assessment"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
