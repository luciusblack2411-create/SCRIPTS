name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "chore/repository-skeleton-v0.1"]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/cisco_assessment

      - name: Tests
        run: pytest

      - name: Build package
        run: python -m build

      - name: CLI smoke test
        run: cisco-assessment version
