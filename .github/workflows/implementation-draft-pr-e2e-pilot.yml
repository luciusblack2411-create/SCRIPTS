name: Implementation Agent Draft PR E2E Pilot

on:
  push:
    branches:
      - agent/implementation/draft-pr-e2e-pilot-runner-v0.1

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BASE_SHA: 6f9c131a221365b366b96bd17c74c7eaabf569f9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Build exact implementation operation
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          from pathlib import Path

          from cisco_assessment.devtools.implementation import (
              ComponentId,
              ImplementationAuthorization,
              ImplementationFileChangeKind,
              ImplementationOperation,
              ImplementationProposedFileChange,
              ImplementationRequest,
              ImplementationWorkspace,
          )

          run_id = os.environ["GITHUB_RUN_ID"]
          base_sha = os.environ["BASE_SHA"]
          work_branch = f"agent/implementation/draft-pr-e2e-{run_id}"
          marker_path = f"tests/unit/devtools/implementation/draft_pr_e2e_marker_{run_id}.py"
          marker_content = "def test_draft_pr_e2e_marker():\n    assert True\n"
          marker_bytes = marker_content.encode("utf-8")
          objective = "Validate controlled Draft PR preparation end-to-end."

          request = ImplementationRequest(
              repository="luciusblack2411-create/SCRIPTS",
              objective=objective,
              authorized_components=(ComponentId.TESTING_FIXTURES,),
              prohibited_components=(ComponentId.COLLECTOR,),
              contracts_to_preserve=("IMPLEMENTATION_AGENT_V1",),
              invariants=("No Cisco execution.", "Human merge gate remains mandatory."),
              acceptance_criteria=("Exact work-branch CI passes.",),
              contract_approved=True,
              authorization=ImplementationAuthorization.WORK_BRANCH,
          )
          workspace = ImplementationWorkspace(
              repository=request.repository,
              base_branch="main",
              base_sha=base_sha,
              objective=objective,
              authorization=ImplementationAuthorization.WORK_BRANCH,
              plan_step_ids=("impl-step:0001",),
              inspected_paths=("tests/unit/devtools/implementation/test_draft_pr.py",),
              contracts_to_preserve=("IMPLEMENTATION_AGENT_V1",),
              acceptance_criteria=("Exact work-branch CI passes.",),
              changes=(
                  ImplementationProposedFileChange(
                      ordinal=1,
                      change_id="impl-change:0001",
                      kind=ImplementationFileChangeKind.CREATE,
                      path=marker_path,
                      component=ComponentId.TESTING_FIXTURES,
                      proposed_content_sha256=hashlib.sha256(marker_bytes).hexdigest(),
                      proposed_byte_size=len(marker_bytes),
                      proposed_content=marker_content,
                      rationale="Exercise controlled Draft PR preparation with a disposable testing-only change.",
                      acceptance_criteria=("Exact work-branch CI passes.",),
                  ),
              ),
          )
          operation = ImplementationOperation(
              request=request,
              workspace=workspace,
              work_branch=work_branch,
              commit_message="test(devtools): create disposable Draft PR e2e marker",
          )
          Path("pilot_operation.json").write_text(
              operation.model_dump_json(indent=2), encoding="utf-8"
          )
          PY

      - name: Execute implementation operation
        run: cisco-implementation run pilot_operation.json --output json > operational_result.json

      - name: Create controlled Draft PR from exact operational evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          from cisco_assessment.devtools.implementation import (
              GitHubImplementationDraftPrBackend,
              ImplementationAuthorization,
              ImplementationDraftPrDecision,
              ImplementationDraftPrRequest,
              ImplementationOperationalResult,
              prepare_implementation_draft_pr,
          )

          operational = ImplementationOperationalResult.model_validate_json(
              Path("operational_result.json").read_text(encoding="utf-8")
          )
          run_id = os.environ["GITHUB_RUN_ID"]
          request = ImplementationDraftPrRequest(
              repository=operational.repository,
              objective=operational.objective,
              base_branch=operational.mutation.base_branch,
              base_sha=operational.mutation.base_sha,
              work_branch=operational.mutation.work_branch,
              commit_sha=operational.mutation.commit_sha,
              title=f"test(devtools): disposable Draft PR pilot {run_id}",
              body=(
                  "Disposable REAL E2E validation for controlled Draft PR preparation.\n\n"
                  f"Operational decision: {operational.decision.value}\n"
                  f"Base SHA: {operational.mutation.base_sha}\n"
                  f"Work branch: {operational.mutation.work_branch}\n"
                  f"Commit SHA: {operational.mutation.commit_sha}\n\n"
                  "This PR must remain draft and must never be merged."
              ),
              authorization=ImplementationAuthorization.DRAFT_PR,
          )
          result = prepare_implementation_draft_pr(
              operational,
              request,
              GitHubImplementationDraftPrBackend(),
          )
          assert result.decision is ImplementationDraftPrDecision.DRAFT_PR_CREATED
          assert result.draft is True
          assert result.pull_request_created is True
          assert result.pull_request_ready_for_review is False
          assert result.review_executed is False
          assert result.merge_performed is False
          assert result.human_merge_gate_required is True
          assert result.cisco_execution_allowed is False
          Path("draft_pr_result.json").write_text(
              result.model_dump_json(indent=2), encoding="utf-8"
          )
          print(result.model_dump_json(indent=2))
          PY

      - name: Show operational evidence
        if: always()
        run: |
          test -f operational_result.json && cat operational_result.json || true
          test -f draft_pr_result.json && cat draft_pr_result.json || true
