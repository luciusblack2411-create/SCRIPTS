name: Implementation Agent E2E Pilot

on:
  push:
    branches:
      - "agent/implementation/e2e-pilot-runner-v0.1"

permissions:
  contents: write
  actions: write

jobs:
  operational-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pilot runner branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Build exact operation
        env:
          PILOT_REPOSITORY: ${{ github.repository }}
          PILOT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import subprocess
          from pathlib import Path

          from cisco_assessment.devtools.implementation.enums import (
              ImplementationAuthorization,
              ImplementationFileChangeKind,
          )
          from cisco_assessment.devtools.implementation.models import ImplementationRequest
          from cisco_assessment.devtools.implementation.operational import ImplementationOperation
          from cisco_assessment.devtools.implementation.workspace import (
              ImplementationProposedFileChange,
              ImplementationWorkspace,
          )
          from cisco_assessment.devtools.pr_review.enums import ComponentId

          repository = os.environ["PILOT_REPOSITORY"]
          run_id = os.environ["PILOT_RUN_ID"]
          base_sha = subprocess.check_output(
              ["git", "ls-remote", "origin", "refs/heads/main"], text=True
          ).split()[0]
          objective = "Validate IMPLEMENTATION_AGENT_V1 operational mutation and CI gate end-to-end."
          criterion = "Publish exactly one CREATE change and validate ci.yml on the exact work-branch commit."
          marker_path = "tests/unit/devtools/implementation/e2e_operational_pilot_marker.py"
          marker_content = (
              '"""Disposable IMPLEMENTATION_AGENT_V1 end-to-end pilot marker; never merge."""\n\n'
              f'PILOT_RUN_ID = "{run_id}"\n'
          )
          marker_bytes = marker_content.encode("utf-8")

          request = ImplementationRequest(
              repository=repository,
              expected_base_branch="main",
              objective=objective,
              authorized_components=(ComponentId.TESTING_FIXTURES,),
              prohibited_components=(
                  ComponentId.COLLECTOR,
                  ComponentId.COMMAND_CATALOG,
                  ComponentId.RAW_MODELS,
                  ComponentId.NORMALIZED_MODELS,
                  ComponentId.PARSER,
                  ComponentId.ENGINE,
                  ComponentId.RULES,
                  ComponentId.REPORTING,
                  ComponentId.ASSESSMENT_PLAN,
                  ComponentId.RUNNER_CLI,
              ),
              invariants=(
                  "Human merge gate remains required.",
                  "Cisco execution remains disabled.",
                  "No pull request is created by this pilot.",
              ),
              acceptance_criteria=(criterion,),
              contract_approved=True,
              authorization=ImplementationAuthorization.WORK_BRANCH,
          )
          change = ImplementationProposedFileChange(
              ordinal=1,
              change_id="impl-change:0001",
              kind=ImplementationFileChangeKind.CREATE,
              path=marker_path,
              component=ComponentId.TESTING_FIXTURES,
              proposed_content_sha256=hashlib.sha256(marker_bytes).hexdigest(),
              proposed_byte_size=len(marker_bytes),
              proposed_content=marker_content,
              rationale="Exercise the production Git Data mutation backend without touching productive Cisco code.",
              acceptance_criteria=(criterion,),
          )
          workspace = ImplementationWorkspace(
              repository=repository,
              base_branch="main",
              base_sha=base_sha,
              objective=objective,
              authorization=ImplementationAuthorization.WORK_BRANCH,
              plan_step_ids=("impl-step:0001",),
              inspected_paths=("pyproject.toml",),
              acceptance_criteria=(criterion,),
              changes=(change,),
          )
          operation = ImplementationOperation(
              request=request,
              workspace=workspace,
              work_branch=f"agent/implementation/e2e-pilot-{run_id}",
              commit_message=f"test(devtools): implementation agent e2e pilot {run_id}",
          )
          Path("/tmp/implementation-operation.json").write_text(
              operation.model_dump_json(indent=2), encoding="utf-8"
          )
          print(f"PILOT_BASE_SHA={base_sha}")
          print(f"PILOT_WORK_BRANCH={operation.work_branch}")
          PY

      - name: Execute production implementation entrypoint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cisco-implementation run /tmp/implementation-operation.json \
            --output json \
            --timeout-seconds 900 \
            --poll-seconds 3 | tee /tmp/implementation-result.json

      - name: Assert canonical safety invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/implementation-result.json").read_text(encoding="utf-8"))
          assert result["decision"] == "READY_FOR_DRAFT_PR", result
          assert result["pull_request_created"] is False, result
          assert result["merge_performed"] is False, result
          assert result["human_merge_gate_required"] is True, result
          assert result["cisco_execution_allowed"] is False, result
          assert result["mutation"]["base_fresh_after_publish"] is True, result
          assert result["ci_validation"]["base_fresh_after_ci"] is True, result
          print("IMPLEMENTATION_E2E_PILOT=PASS")
          print(f"PILOT_COMMIT_SHA={result['mutation']['commit_sha']}")
          print(f"PILOT_CI_RUN_ID={result['ci_validation']['run_id']}")
          PY
