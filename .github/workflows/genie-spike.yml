name: Genie Interface Status Spike

on:
  push:
    branches: ["spike/genie-interfaces-status"]
  pull_request:
    branches: [main]

jobs:
  genie-spike:
    if: github.event_name == 'push' || github.head_ref == 'spike/genie-interfaces-status'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Install Genie core without ecosystem dependencies
        run: python -m pip install --no-deps 'genie==26.6' 'genie.libs.parser==26.6'

      - name: Install parser runtime imports only
        run: >-
          python -m pip install
          'pyats.log==26.6'
          'pyats.configuration==26.6'
          'pyats.utils==26.6'
          'xmltodict>=0.13,<1'
          'packaging>=24,<26'

      - name: Characterize installed distributions
        run: python -m pip freeze | sort

      - name: Run Genie spike tests
        run: pytest -q tests/spikes/test_genie_interfaces_status.py

      - name: Lint spike code
        run: ruff check src/cisco_assessment/models/interface.py src/cisco_assessment/parsers/ios/show_interfaces_status.py tests/spikes/test_genie_interfaces_status.py

      - name: Type check framework
        run: mypy src/cisco_assessment
