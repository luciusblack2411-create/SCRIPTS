name: Genie Interface Status Spike

on:
  push:
    branches: ["spike/genie-interfaces-status"]
  pull_request:
    branches: [main]

jobs:
  genie-spike:
    if: github.event_name == 'push' || github.head_ref == 'spike/genie-interfaces-status'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Install Genie and pyATS parser cores without ecosystems
        run: >-
          python -m pip install --no-deps
          'genie==26.6'
          'genie.libs.parser==26.6'
          'pyats==26.6'
          'pyats.log==26.6'
          'pyats.utils==26.6'
          'pyats.easypy==26.6'

      - name: Install non-framework parser imports
        run: >-
          python -m pip install
          'xmltodict>=0.13,<1'
          'packaging>=24,<26'

      - name: Characterize installed distributions
        run: python -m pip freeze | sort

      - name: Import exact Genie parser path
        run: >-
          python -c "from genie.libs.parser.iosxe.show_interface import ShowInterfacesStatus;
          from genie.libs.parser.utils.common import Common;
          print(ShowInterfacesStatus, Common.convert_intf_name('Gi1/0/1'))"

      - name: Run Genie spike tests
        run: pytest -q -ra spikes/test_genie_interfaces_status.py

      - name: Lint spike code
        run: ruff check src/cisco_assessment/models/interface.py src/cisco_assessment/parsers/ios/show_interfaces_status.py spikes/test_genie_interfaces_status.py

      - name: Type check framework
        run: mypy src/cisco_assessment
