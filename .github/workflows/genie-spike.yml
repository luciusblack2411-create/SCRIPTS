name: Genie Interface Status Spike

on:
  push:
    branches: ["spike/genie-interfaces-status"]
  pull_request:
    branches: [main]

jobs:
  genie-spike:
    if: github.event_name == 'push' || github.head_ref == 'spike/genie-interfaces-status'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Snapshot pre-Genie environment
        shell: bash
        run: |
          python -m pip freeze | sort > /tmp/pip-before-genie.txt
          SITE_PACKAGES="$(python -c 'import site; print(site.getsitepackages()[0])')"
          du -sk "$SITE_PACKAGES" | awk '{print $1}' > /tmp/site-packages-before-kib.txt

      - name: Install officially resolved Genie dependency closure
        run: python -m pip install -r requirements/spikes/genie-interfaces-status.txt

      - name: Verify dependency closure
        run: python -m pip check

      - name: Characterize installed dependency footprint
        shell: bash
        run: |
          python -m pip freeze | sort | tee /tmp/pip-after-genie.txt
          SITE_PACKAGES="$(python -c 'import site; print(site.getsitepackages()[0])')"
          BEFORE_KIB="$(cat /tmp/site-packages-before-kib.txt)"
          AFTER_KIB="$(du -sk "$SITE_PACKAGES" | awk '{print $1}')"
          DELTA_KIB="$((AFTER_KIB - BEFORE_KIB))"
          echo "site_packages_before_kib=${BEFORE_KIB}"
          echo "site_packages_after_kib=${AFTER_KIB}"
          echo "site_packages_delta_kib=${DELTA_KIB}"
          echo "new_or_changed_freeze_entries=$(comm -13 /tmp/pip-before-genie.txt /tmp/pip-after-genie.txt | wc -l)"
          echo "--- new/changed distributions after Genie install ---"
          comm -13 /tmp/pip-before-genie.txt /tmp/pip-after-genie.txt

      - name: Import exact Genie parser path
        run: >-
          python -c "from genie.libs.parser.iosxe.show_interface import ShowInterfacesStatus;
          from genie.libs.parser.utils.common import Common;
          print(ShowInterfacesStatus, Common.convert_intf_name('Gi1/0/1'))"

      - name: Run Genie spike tests
        run: pytest -q -ra spikes/test_genie_interfaces_status.py

      - name: Run normal framework tests
        run: pytest -q -ra tests

      - name: Ruff
        run: ruff check src tests spikes

      - name: Mypy
        run: mypy src/cisco_assessment
